<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e12" />
      <stop offset="100%" stop-color="#14151a" />
    </linearGradient>
    <pattern id="gridAlu" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#919599" stroke-width="0.8" stroke-opacity="0.15" />
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg2)" />
  <rect width="800" height="500" rx="16" fill="url(#gridAlu)" />
  
  <!-- ALU Trapezoid in Clockwork Orange -->
  <polygon points="260,140 540,140 480,340 380,340 370,300 360,340 320,340" fill="#1a1c22" stroke="#E56515" stroke-width="3" />
  
  <text x="400" y="240" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#F8F8F8" text-anchor="middle">4-BIT ALU</text>
  <text x="400" y="270" font-family="monospace" font-size="13" font-weight="600" fill="#FBA45C" text-anchor="middle">ADD | SUB | AND | XOR</text>
  
  <!-- Inputs A and B -->
  <line x1="320" y1="60" x2="320" y2="140" stroke="#FBA45C" stroke-width="3" />
  <text x="320" y="50" font-family="monospace" font-size="14" fill="#FBA45C" text-anchor="middle">Input A [3:0]</text>
  
  <line x1="480" y1="60" x2="480" y2="140" stroke="#FBA45C" stroke-width="3" />
  <text x="480" y="50" font-family="monospace" font-size="14" fill="#FBA45C" text-anchor="middle">Input B [3:0]</text>
  
  <!-- Control Lines -->
  <line x1="160" y1="230" x2="280" y2="230" stroke="#CDCDCB" stroke-width="2.5" />
  <text x="140" y="235" font-family="monospace" font-size="13" fill="#CDCDCB" text-anchor="end">Opcode [1:0]</text>
  
  <!-- Output & Flags -->
  <line x1="400" y1="340" x2="400" y2="430" stroke="#E56515" stroke-width="3" />
  <text x="400" y="455" font-family="monospace" font-size="14" fill="#E56515" text-anchor="middle">Result [3:0]</text>
  
  <line x1="460" y1="340" x2="520" y2="410" stroke="#FBA45C" stroke-width="2" />
  <text x="560" y="415" font-family="monospace" font-size="13" fill="#FBA45C">Carry / Overflow</text>
  
  <!-- Status Indicator Badge -->
  <rect x="580" y="30" width="180" height="34" rx="6" fill="#14151a" stroke="#919599" stroke-width="1" stroke-opacity="0.3" />
  <circle cx="600" cy="47" r="5" fill="#E56515" />
  <text x="615" y="52" font-family="monospace" font-size="12" fill="#CDCDCB">SIMULATION: PASS</text>
</svg>
