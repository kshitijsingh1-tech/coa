<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a" />
      <stop offset="50%" stop-color="#1a1c22" />
      <stop offset="100%" stop-color="#0d0e12" />
    </linearGradient>
    <linearGradient id="clockworkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E56515" />
      <stop offset="50%" stop-color="#FBA45C" />
      <stop offset="100%" stop-color="#CDCDCB" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E56515" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0d0e12" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#919599" stroke-width="0.7" stroke-opacity="0.18" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  <rect width="400" height="400" rx="40" fill="url(#gridPattern)" />
  <circle cx="200" cy="180" r="150" fill="url(#glow)" />

  <!-- Outer Neon Ring with Clockwork Accent -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#clockworkGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.65" />
  
  <!-- Silhouette / Monogram Avatar -->
  <circle cx="200" cy="155" r="54" fill="#14151a" stroke="url(#clockworkGrad)" stroke-width="3" />
  <!-- Hair / Head stylized -->
  <path d="M165 155 Q200 115 235 155 Q215 130 185 130 Z" fill="#E56515" opacity="0.85" />
  
  <!-- Modern Glasses / Tech Detail in Clockwork Peach -->
  <rect x="175" y="145" width="20" height="12" rx="3" fill="none" stroke="#FBA45C" stroke-width="2.5" />
  <rect x="205" y="145" width="20" height="12" rx="3" fill="none" stroke="#FBA45C" stroke-width="2.5" />
  <line x1="195" y1="151" x2="205" y2="151" stroke="#FBA45C" stroke-width="2.5" />

  <!-- Torso & Shoulders -->
  <path d="M120 300 C120 235 150 230 200 230 C250 230 280 235 280 300" fill="#1a1c22" stroke="url(#clockworkGrad)" stroke-width="3" />

  <!-- Terminal / Architecture Badge -->
  <rect x="145" y="255" width="110" height="30" rx="6" fill="#0d0e12" stroke="#E56515" stroke-width="1.5" />
  <text x="200" y="275" font-family="monospace" font-size="13" font-weight="700" fill="#FBA45C" text-anchor="middle">CSE :: COA</text>

  <!-- Technical Node Accents -->
  <circle cx="90" cy="90" r="4" fill="#E56515" />
  <line x1="90" y1="90" x2="130" y2="130" stroke="#E56515" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3 3" />
  
  <circle cx="310" cy="90" r="4" fill="#FBA45C" />
  <line x1="310" y1="90" x2="270" y2="130" stroke="#FBA45C" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3 3" />

  <!-- Corner Brackets in Clockwork Orange -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#E56515" stroke-width="2" />
  <path d="M 370 50 L 370 30 L 350 30" fill="none" stroke="#E56515" stroke-width="2" />
  <path d="M 30 350 L 30 370 L 50 370" fill="none" stroke="#E56515" stroke-width="2" />
  <path d="M 370 350 L 370 370 L 350 370" fill="none" stroke="#E56515" stroke-width="2" />
</svg>
